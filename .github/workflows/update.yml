name: Daily FCN Update

on:
  schedule:
    - cron: '30 9 * * 1-5'   # 台北時間 17:30（週一至週五）
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance

      - name: Generate HTML
        run: python scripts/fcn_report.py docs/index.html

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git commit -m "update $(date -u +'%Y-%m-%d %H:%M')" || { echo "nothing to commit"; exit 0; }
          git push
